<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#e9e3d6">
<title>The Floor</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<style>
:root{
  --desk:#e9e3d6;
  --panel:#faf8f3;
  --ink:#23292e;
  --muted:#6f7680;
  --line:#d9d0c1;
  --hair:#e5ddce;
  --ena:#2f6e7a;
  --ena-soft:#cfe0e2;
  --p1:#d8d0be;
  --p2:#9dbfc4;
  --mono:ui-monospace,'SF Mono',Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  min-height:100vh;
  background:var(--desk);
  color:var(--ink);
  font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  line-height:1.45;
  -webkit-font-smoothing:antialiased;
}
.wrap{
  max-width:520px;
  margin:0 auto;
  padding:20px 20px 44px;
  padding-top:calc(20px + env(safe-area-inset-top));
}

/* header */
.eyebrow{font-size:11px;letter-spacing:2.5px;text-transform:uppercase;color:var(--muted);font-weight:600}
.title-row{display:flex;align-items:flex-end;justify-content:space-between;margin-top:9px}
.title{
  display:inline-block;
  border:1.5px solid var(--ink);
  padding:3px 15px 5px;
  font-family:Georgia,'Times New Roman',serif;
  font-size:27px;
  letter-spacing:.5px;
}
.week-tag{font-family:var(--mono);font-size:11px;color:var(--muted);padding-bottom:4px}
.week-of{font-size:12.5px;color:var(--muted);margin-top:9px}
header{margin-bottom:20px}

/* tabs */
.tabs{display:flex;gap:8px;margin-bottom:16px}
.tab{
  font-family:inherit;font-size:11px;letter-spacing:1.6px;text-transform:uppercase;
  font-weight:700;color:var(--muted);background:none;border:1px solid var(--line);
  border-radius:20px;padding:7px 16px;cursor:pointer;
}
.tab[aria-selected="true"]{background:var(--ink);border-color:var(--ink);color:var(--panel)}
.tab:focus-visible{outline:2px solid var(--ena);outline-offset:2px}

/* cards */
.card{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:14px;
  box-shadow:0 5px 22px -14px rgba(35,41,46,.5);
  overflow:hidden;
}
.marks-card{margin-bottom:16px}
.marks{padding:8px 10px}

/* mark rows */
.divider{height:1px;background:var(--hair);margin:0 16px}
.row{
  display:flex;align-items:center;gap:13px;
  padding:15px 14px;border-radius:11px;cursor:pointer;
}
.row:hover{background:rgba(0,0,0,.028)}
.row.ro{cursor:default}
.row.ro:hover{background:transparent}
.pip:disabled{cursor:default}
.row:focus-visible{outline:2px solid var(--ena);outline-offset:2px}
.badge{
  width:36px;height:36px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:16px;flex:none;background:var(--ena-soft);
}
.row-text{flex:1;min-width:0}
.row-name{font-size:15.5px;font-weight:600;display:block}
.row-sub{display:block;font-size:11.5px;color:var(--muted);margin-top:1px}
.pips{display:flex;gap:5px}
.pip{
  width:18px;height:18px;border-radius:50%;cursor:pointer;padding:0;
  border:1.6px solid var(--ena);background:transparent;
  transition:background .16s ease,transform .16s ease;
}
.pip.filled{background:var(--ena)}
.pip.pop{animation:floorPop .3s ease}
.pip:focus-visible{outline:2px solid var(--ena);outline-offset:2px}
@keyframes floorPop{0%{transform:scale(1)}40%{transform:scale(1.35)}100%{transform:scale(1)}}
.row-state{
  font-family:var(--mono);font-size:11.5px;color:var(--muted);
  width:50px;text-align:right;flex:none;
}
.row-state.done{color:var(--ena)}

/* floor footer */
.floor-footer{
  padding:15px 24px;border-top:1px solid var(--hair);
  display:flex;align-items:center;justify-content:space-between;
}
.floor-footer .label{font-size:11px;letter-spacing:1.6px;text-transform:uppercase;color:var(--muted);font-weight:700}
.floor-footer .count{font-family:var(--mono);font-size:13px;color:var(--muted);font-weight:600}
.floor-footer.done{background:#e8f0ee}
.floor-footer.done .label,.floor-footer.done .count{color:var(--ena)}

/* actions row */
.actions{
  display:flex;justify-content:space-between;align-items:center;
  padding:0 4px;margin-bottom:18px;gap:12px;
}
.hint{font-size:11.5px;color:var(--muted);line-height:1.4}
.reset{
  font-family:inherit;font-size:11.5px;color:var(--muted);
  background:none;border:1px solid var(--line);border-radius:20px;
  padding:6px 13px;cursor:pointer;flex:none;
}
.reset:hover{border-color:var(--ink);color:var(--ink)}
.reset:focus-visible{outline:2px solid var(--ena);outline-offset:2px}

/* workouts */
.picker{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.pick{
  font-family:inherit;font-size:12.5px;font-weight:600;color:var(--ink);
  background:var(--panel);border:1px solid var(--line);border-radius:20px;
  padding:7px 13px;cursor:pointer;
}
.pick[aria-pressed="true"]{background:var(--ena);border-color:var(--ena);color:var(--panel)}
.pick:focus-visible{outline:2px solid var(--ena);outline-offset:2px}
.part-card{margin-bottom:16px}
.part-head{display:flex;justify-content:space-between;align-items:baseline;padding:16px 24px 3px}
.part-name{font-size:11px;letter-spacing:2px;text-transform:uppercase;font-weight:700}
.part-span{font-family:var(--mono);font-size:12px;color:var(--muted)}
.wrows{padding:4px 10px 10px}
.wrow{display:flex;align-items:center;gap:10px;padding:10px 14px}
.wrow-text{flex:1;min-width:0}
.wrow-name{font-size:14.5px;font-weight:600;display:block}
.wrow-rx{display:block;font-family:var(--mono);font-size:11px;color:var(--muted);margin-top:1px}
.wrow input{
  width:64px;height:34px;text-align:center;font-family:var(--mono);font-size:13px;
  border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink);flex:none;
}
.wrow input::placeholder{color:#b3b8be}
.wrow input:focus{outline:2px solid var(--ena);background:#fff}
.record-row{display:flex;align-items:center;gap:12px;padding:0 4px;margin-bottom:18px}
.record{
  font-family:inherit;font-size:12px;letter-spacing:1.6px;text-transform:uppercase;font-weight:700;
  color:var(--panel);background:var(--ink);border:1px solid var(--ink);border-radius:20px;
  padding:9px 22px;cursor:pointer;flex:none;
}
.record:focus-visible{outline:2px solid var(--ena);outline-offset:2px}
.record-status{font-size:12px;color:var(--muted);line-height:1.4}
.record-status.ok{color:var(--ena);font-weight:600}

/* annual strip */
.strip{padding:17px 22px 19px}
.strip-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:13px}
.strip-year{font-size:11px;letter-spacing:2px;text-transform:uppercase;font-weight:700}
.strip-cov{font-family:var(--mono);font-size:12px;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(13,1fr);gap:4px}
@media (max-width:420px){.grid{grid-template-columns:repeat(9,1fr)}}
.cell{aspect-ratio:1;border-radius:3px}
button.cell{border:none;padding:0;font:inherit;cursor:pointer}
button.cell:focus-visible{outline:2px solid var(--ena);outline-offset:1px}
.cell.now{outline:2px solid var(--ink);outline-offset:1px}
.cell.viewing{outline:2px solid var(--ena);outline-offset:1px}
.cell.future{background:transparent;border:1px dashed var(--line)}
.legend{display:flex;gap:13px;margin-top:14px;font-size:10.5px;color:var(--muted);flex-wrap:wrap}
.legend span{display:flex;align-items:center;gap:6px}
.ver{margin-top:18px;text-align:center;font-family:var(--mono);font-size:10px;color:var(--muted);opacity:.65}
.swatch{width:11px;height:11px;border-radius:3px;flex:none}
.swatch.ahead{border:1px dashed var(--line);background:transparent}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="eyebrow">Weekly Floor</div>
    <div class="title-row">
      <div class="title">The Floor</div>
      <div class="week-tag" id="week-tag"></div>
    </div>
    <div class="week-of" id="week-of"></div>
  </header>

  <div class="tabs" role="tablist" aria-label="Views">
    <button class="tab" role="tab" id="tab-floor" aria-selected="true" aria-controls="view-floor">Floor</button>
    <button class="tab" role="tab" id="tab-workouts" aria-selected="false" aria-controls="view-workouts">Workouts</button>
  </div>

  <div id="view-floor" role="tabpanel" aria-labelledby="tab-floor">

  <div class="card marks-card">
    <div class="marks" id="marks"></div>
    <div class="floor-footer" id="floor-footer">
      <span class="label">Floor complete</span>
      <span class="count" id="floor-count"></span>
    </div>
  </div>

  <div class="actions" id="actions">
    <div class="hint">Tap a row to log a session.<br>Tap a filled pip to undo. Weeks roll over each Monday.</div>
    <button class="reset" id="reset">Reset week</button>
  </div>

  <div class="actions" id="viewbar" hidden>
    <div class="hint" id="view-label"></div>
    <button class="reset" id="back-live">Back to this week</button>
  </div>

  <div class="card">
    <div class="strip">
      <div class="strip-head">
        <span class="strip-year" id="strip-year"></span>
        <span class="strip-cov" id="strip-cov"></span>
      </div>
      <div class="grid" id="grid"></div>
      <div class="legend">
        <span><span class="swatch" style="background:var(--ena)"></span>full</span>
        <span><span class="swatch" style="background:var(--p2)"></span>partial</span>
        <span><span class="swatch" style="background:var(--p1)"></span>thin</span>
        <span><span class="swatch" style="background:var(--hair)"></span>absent</span>
        <span><span class="swatch ahead"></span>ahead</span>
      </div>
    </div>
  </div>

  </div><!-- /view-floor -->

  <div id="view-workouts" role="tabpanel" aria-labelledby="tab-workouts" hidden>
    <div class="picker" id="picker" role="group" aria-label="Routine"></div>
    <div id="workout-parts"></div>
    <div class="record-row">
      <button class="record" id="record" type="button">Record</button>
      <div class="record-status" id="record-status" role="status" aria-live="polite"></div>
    </div>
    <div class="actions">
      <div class="hint">Type the weight you used (or BW). Grey = last time.<br>Tap Record at the end of the session.</div>
    </div>
  </div>

  <!-- keep in step with CACHE in sw.js — this is how a phone proves which
       version it renders -->
  <div class="ver">v8</div>

</div>

<script>
const MARKS = [
  { id:'car', icon:'🏃', name:'Cardio',   sub:'150 min · 5 × 30',         target:5, unit:'min', per:30 },
  { id:'str', icon:'🏋️', name:'Strength', sub:'2 sessions · 20 min each', target:2, unit:'x' },
  { id:'yog', icon:'🧘', name:'Yoga',     sub:'2 sessions',               target:2, unit:'x' },
];

// Workout routines (kairos-system BACKLOG, Workouts epic): three routines,
// each in the plan's three parts. Only loadable exercises are tracked;
// changing a routine is a push, not an in-app edit. Ids are storage keys:
// stable forever — a rename changes only `name`. `airplane` is one id in
// Lower and Posture, so its progression is one line.
const ROUTINES = [
  { id:'upper', name:'Upper Body', parts:[
    { name:'Part 1', span:'20′', exercises:[
      { id:'bench',    name:'DB Bench Press (flat/incline)',     rx:'4 × 8–10' },
      { id:'csrow',    name:'Chest-Supported DB Row',            rx:'4 × 8–10' },
    ]},
    { name:'Part 2', span:'40′', exercises:[
      { id:'hkpress',  name:'Half-Kneeling 1-Arm DB Press',      rx:'3 × 8–10 / side' },
      { id:'pulldown', name:'Lat Pulldown / Neutral-Grip Pull-up', rx:'3 × 8–10' },
      { id:'dips',     name:'Dips / Push-ups',                   rx:'3 × 10–15' },
    ]},
    { name:'Part 3', span:'60′', exercises:[
      { id:'latraise', name:'DB Lateral Raise',                  rx:'3 × 12–15' },
      { id:'reardelt', name:'Incline Rear Delt Fly',             rx:'3 × 12–15' },
      { id:'hammer',   name:'Hammer Curl',                       rx:'3 × 10–12' },
      { id:'triext',   name:'Overhead Triceps Extension',        rx:'3 × 10–12' },
      { id:'hang',     name:'Scapular Hang',                     rx:'3 × 30 s' },
    ]},
  ]},
  { id:'lower', name:'Lower Body', parts:[
    { name:'Part 1', span:'20′', exercises:[
      { id:'deadlift', name:'Trap Bar Deadlift / DB RDL',        rx:'4 × 6–8' },
      { id:'spanish',  name:'Spanish Squat / Wall Sit',          rx:'3 × 30–45 s' },
    ]},
    { name:'Part 2', span:'40′', exercises:[
      { id:'slrdl',    name:'Single-Leg RDL (kickstand)',        rx:'3 × 8–10 / side' },
      { id:'legcurl',  name:'Hamstring Glider / Leg Curl',       rx:'3 × 10–12' },
      { id:'tke',      name:'Terminal Knee Extension (band)',    rx:'3 × 15 / leg' },
    ]},
    { name:'Part 3', span:'60′', exercises:[
      { id:'legraise', name:'Side-Lying Leg Raise',              rx:'3 × 12' },
      { id:'airplane', name:'Hip Airplane',                      rx:'3 × 5 / side' },
      { id:'farmer',   name:"Farmer's Walk",                     rx:'4 × 40–50 m' },
    ]},
  ]},
  { id:'posture', name:'Posture & Stability', parts:[
    { name:'Part 1', span:'20′', exercises:[
      { id:'ytw',      name:'Prone Y-T-W Raise',                 rx:'3 × 8 / letter' },
      { id:'facepull', name:'Banded Face Pull',                  rx:'3 × 15' },
      { id:'deadbug',  name:'Dead Bug with KB Press',            rx:'3 × 8 / side' },
    ]},
    { name:'Part 2', span:'40′', exercises:[
      { id:'airplane', name:'Hip Airplane (supported)',          rx:'3 × 6–8 / side' },
      { id:'march',    name:'Banded Hip March',                  rx:'3 × 12 / leg' },
      { id:'pallof',   name:'Pallof Press + Overhead Raise',     rx:'3 × 10 / side' },
    ]},
    { name:'Part 3', span:'60′', exercises:[
      { id:'suitcase', name:'Suitcase Carry',                    rx:'4 × 30 m / side' },
      { id:'backext',  name:'Back Extension Hold',               rx:'3 × 30–45 s' },
    ]},
  ]},
];

// Custom week numbering, not true ISO-8601: week 1 starts Jan 1 regardless of
// weekday, and each new week begins on Monday. Historical storage keys depend
// on this exact formula — for 2026 the numbers happen to match the earlier
// Sunday-start scheme, so pre-existing data keeps its keys.
function weekNumber(d){
  const jan1 = new Date(d.getFullYear(), 0, 1);
  // Normalize to local midnight so time-of-day (and DST offsets) can't leak
  // into the day count — the raw (d - jan1) version bumped the last day of
  // a week into the next week for any time after 00:00.
  const d0 = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  const days = Math.round((d0 - jan1) / 86400000);
  const mondayIndex = (jan1.getDay() + 6) % 7; // Mon=0 … Sun=6
  return Math.ceil((days + mondayIndex + 1) / 7);
}
function keyFor(y, w){ return 'floor-' + y + '-w' + w; }

// Exact inverse of weekNumber(): the first day of week w. Week 1 starts
// Jan 1 whatever the weekday; every later week starts on a Monday.
function weekStart(y, w){
  const mondayIndex = (new Date(y, 0, 1).getDay() + 6) % 7; // Mon=0 … Sun=6
  return new Date(y, 0, w === 1 ? 1 : 1 + 7 * (w - 1) - mondayIndex);
}

let now = new Date();
let year = now.getFullYear();
let week = weekNumber(now);
let key = keyFor(year, week);

function loadWeek(k){
  try{ const raw = localStorage.getItem(k); if(raw) return JSON.parse(raw); }catch(e){}
  return null;
}
let data = loadWeek(key) || { car:0, str:0, yog:0 };

// Week lens: a past week being viewed read-only, or null = live. Kept as
// {year, week} rather than a key so a year rollover underneath the viewer
// can't repoint it — the live year/week/key advance in syncWeek(), the
// lens keeps showing the week it was opened on.
let viewing = null;

// The week is derived from the date, never advanced manually. A PWA can stay
// alive in memory across a week boundary, so re-derive whenever the app
// comes back into view; if the key changed, load that week's record fresh.
// Finished weeks stay in localStorage under their own keys, so the annual
// strip picks them up without any manual reset.
function syncWeek(){
  now = new Date();
  const y = now.getFullYear(), w = weekNumber(now), k = keyFor(y, w);
  if(k !== key){
    year = y; week = w; key = k;
    data = loadWeek(key) || { car:0, str:0, yog:0 };
  }
  render();
}
document.addEventListener('visibilitychange', () => {
  if(document.visibilityState === 'visible') syncWeek();
});
window.addEventListener('focus', syncWeek);

// A failed write (storage full/blocked) must not leave the screen stale.
function persist(){
  try{ localStorage.setItem(key, JSON.stringify(data)); }catch(e){}
  render();
}

function levelFor(ws){
  if(!ws) return 0;
  let done = 0;
  MARKS.forEach(m => { if((ws[m.id] || 0) >= m.target) done++; });
  return done;
}

// Pip index that just filled, per mark — animated once on the next render.
let justFilled = null;

function tick(id){
  const m = MARKS.find(x => x.id === id);
  if(data[id] < m.target){
    data[id] += 1;
    justFilled = { id, i: data[id] - 1 };
  }
  persist();
}
function setPip(id, i){
  if(i + 1 === data[id]){
    data[id] = i;
  } else {
    data[id] = i + 1;
    justFilled = { id, i };
  }
  persist();
}
function reset(){
  if(confirm("Reset this week's marks?")){
    data = { car:0, str:0, yog:0 };
    persist();
  }
}

const P = { 0:'var(--hair)', 1:'var(--p1)', 2:'var(--p2)', 3:'var(--ena)' };

function render(){
  // The marks card is rebuilt wholesale; remember what had focus so keyboard
  // users don't lose their place after Enter/Space triggers a re-render.
  const active = document.activeElement;
  const refocus = active && active.dataset ? {
    row: active.closest ? (active.closest('.row') || {}).dataset : null,
    pip: active.classList && active.classList.contains('pip') ? active.dataset : null,
  } : null;

  // A viewed week renders from its stored record (absent key = the empty
  // floor — that IS the record); everything below draws `shown` and treats
  // `ro` as "no interactions".
  const view = viewing ? {
    year: viewing.year, week: viewing.week,
    data: loadWeek(keyFor(viewing.year, viewing.week)) || { car:0, str:0, yog:0 },
  } : null;
  const ro = !!view;
  const shown = ro ? view.data : data;

  document.getElementById('week-tag').textContent = 'W' + (ro ? view.week : week);
  document.getElementById('week-of').textContent = 'Week of ' +
    (ro ? weekStart(view.year, view.week) : now)
      .toLocaleDateString(undefined, { month:'short', day:'numeric' });

  document.getElementById('actions').hidden = ro;
  document.getElementById('viewbar').hidden = !ro;
  if(ro){
    document.getElementById('view-label').textContent =
      'Viewing W' + view.week + (view.year !== year ? ' · ' + view.year : '') +
      ' — read-only.';
  }

  const marksEl = document.getElementById('marks');
  marksEl.textContent = '';
  MARKS.forEach((m, idx) => {
    if(idx > 0){
      const div = document.createElement('div');
      div.className = 'divider';
      marksEl.appendChild(div);
    }
    const count = shown[m.id] || 0;
    const done = count >= m.target;

    const row = document.createElement('div');
    row.className = 'row' + (ro ? ' ro' : '');
    row.dataset.id = m.id;
    if(!ro){
      row.setAttribute('role', 'button');
      row.tabIndex = 0;
      row.addEventListener('click', () => tick(m.id));
      row.addEventListener('keydown', e => {
        if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); tick(m.id); }
      });
    }

    const badge = document.createElement('span');
    badge.className = 'badge';
    badge.textContent = m.icon;

    const text = document.createElement('span');
    text.className = 'row-text';
    const name = document.createElement('span');
    name.className = 'row-name';
    name.textContent = m.name;
    const sub = document.createElement('span');
    sub.className = 'row-sub';
    sub.textContent = m.sub;
    text.append(name, sub);

    const pips = document.createElement('span');
    pips.className = 'pips';
    for(let i = 0; i < m.target; i++){
      const pip = document.createElement('button');
      pip.className = 'pip' + (i < count ? ' filled' : '');
      pip.dataset.id = m.id;
      pip.dataset.i = i;
      if(ro){
        pip.disabled = true;
        pip.setAttribute('aria-label', m.name + ' session ' + (i + 1) +
          (i < count ? ' — logged' : ' — not logged'));
      } else {
        if(justFilled && justFilled.id === m.id && justFilled.i === i) pip.classList.add('pop');
        pip.setAttribute('aria-label', m.name + ' session ' + (i + 1) +
          (i < count ? ' — logged, tap to undo' : ''));
        pip.addEventListener('click', e => { e.stopPropagation(); setPip(m.id, i); });
      }
      pips.appendChild(pip);
    }

    const state = document.createElement('span');
    state.className = 'row-state' + (done ? ' done' : '');
    state.textContent = m.unit === 'min' ? (count * m.per) + ' min' : count + ' / ' + m.target;

    row.append(badge, text, pips, state);
    marksEl.appendChild(row);
  });
  justFilled = null;

  if(refocus){
    let el = null;
    if(refocus.pip){
      el = marksEl.querySelector('.pip[data-id="' + refocus.pip.id + '"][data-i="' + refocus.pip.i + '"]');
    } else if(refocus.row && refocus.row.id){
      el = marksEl.querySelector('.row[data-id="' + refocus.row.id + '"]');
    }
    if(el) el.focus();
  }

  const floorDone = MARKS.filter(m => (shown[m.id] || 0) >= m.target).length;
  document.getElementById('floor-count').textContent = floorDone + ' / 3';
  document.getElementById('floor-footer').classList.toggle('done', floorDone === 3);

  // annual strip
  const total = weekNumber(new Date(year, 11, 31));
  let full = 0, counted = 0;
  const grid = document.getElementById('grid');
  grid.textContent = '';
  const LVL_NAME = { 0:'absent', 1:'thin', 2:'partial', 3:'full' };
  for(let w = 1; w <= total; w++){
    // Past and current cells are buttons: past opens the week lens on that
    // week, current returns to live. The strip itself always shows the LIVE
    // year's coverage — the lens only swaps what the marks card renders.
    const cell = document.createElement(w <= week ? 'button' : 'span');
    cell.className = 'cell';
    if(w < week){
      const lvl = levelFor(loadWeek(keyFor(year, w)));
      if(lvl === 3) full++;
      counted++;
      cell.style.background = P[lvl];
      cell.title = 'Week ' + w;
      cell.setAttribute('aria-label', 'Week ' + w + ' — ' + LVL_NAME[lvl] + ', view');
      cell.addEventListener('click', () => { viewing = { year, week: w }; render(); });
      if(view && view.year === year && view.week === w) cell.classList.add('viewing');
    } else if(w === week){
      const lvl = levelFor(data);
      if(lvl === 3) full++;
      counted++;
      cell.style.background = P[lvl];
      cell.classList.add('now');
      cell.title = 'Week ' + w + ' · now';
      cell.setAttribute('aria-label', 'Week ' + w + ' — ' + LVL_NAME[lvl] + ' · now');
      cell.addEventListener('click', () => { viewing = null; render(); });
    } else {
      cell.classList.add('future');
      cell.title = 'Week ' + w;
    }
    if(cell.tagName === 'BUTTON') cell.type = 'button';
    grid.appendChild(cell);
  }
  document.getElementById('strip-year').textContent = year + ' · weekly coverage';
  document.getElementById('strip-cov').textContent = full + ' of ' + counted + ' weeks full';
}

/* ---- workouts tab ---- */

// Recorded workouts: one array, oldest first, under `workouts-log` —
// { id, routine, at (ISO date-time), weights: { exId: value } }, non-empty
// fields only. The old weekly `tracker-*` keys are left in storage, unread.
const LOG_KEY = 'workouts-log';
// Typed-but-unrecorded weights, per routine, so a tab switch or the app
// going to the background loses nothing: { routine, fields: { upper: {…} } }.
const DRAFT_KEY = 'workouts-draft';

function loadJSON(k, fallback){
  try{ const raw = localStorage.getItem(k); if(raw) return JSON.parse(raw); }catch(e){}
  return fallback;
}
function loadLog(){ const l = loadJSON(LOG_KEY, []); return Array.isArray(l) ? l : []; }

let draft = loadJSON(DRAFT_KEY, null);
if(!draft || typeof draft !== 'object' || !draft.fields) draft = { routine: ROUTINES[0].id, fields: {} };
if(!ROUTINES.some(r => r.id === draft.routine)) draft.routine = ROUTINES[0].id;

function saveDraft(){
  try{ localStorage.setItem(DRAFT_KEY, JSON.stringify(draft)); }catch(e){}
}

// The last recorded value per exercise, across all routines — shown as a
// grey placeholder, never saved into the field.
function lastWeights(){
  const last = {};
  loadLog().forEach(w => { Object.assign(last, w.weights || {}); });
  return last;
}

function currentRoutine(){ return ROUTINES.find(r => r.id === draft.routine); }

function setStatus(text, ok){
  const el = document.getElementById('record-status');
  el.textContent = text;
  el.classList.toggle('ok', !!ok);
}

function renderPicker(){
  const host = document.getElementById('picker');
  host.textContent = '';
  ROUTINES.forEach(r => {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'pick';
    b.dataset.id = r.id;
    b.textContent = r.name;
    b.setAttribute('aria-pressed', String(r.id === draft.routine));
    b.addEventListener('click', () => {
      if(r.id === draft.routine) return;
      draft.routine = r.id;
      saveDraft();
      setStatus('');
      renderWorkouts();
    });
    host.appendChild(b);
  });
}

// Rebuilt on routine switch and after Record — never per keystroke, so
// typing keeps its focus.
function renderWorkouts(){
  renderPicker();
  const r = currentRoutine();
  const fields = draft.fields[r.id] || {};
  const last = lastWeights();
  const host = document.getElementById('workout-parts');
  host.textContent = '';
  r.parts.forEach(part => {
    const card = document.createElement('div');
    card.className = 'card part-card';

    const head = document.createElement('div');
    head.className = 'part-head';
    const nm = document.createElement('span');
    nm.className = 'part-name';
    nm.textContent = part.name;
    const sp = document.createElement('span');
    sp.className = 'part-span';
    sp.textContent = part.span;
    head.append(nm, sp);
    card.appendChild(head);

    const rows = document.createElement('div');
    rows.className = 'wrows';
    part.exercises.forEach((ex, idx) => {
      if(idx > 0){
        const div = document.createElement('div');
        div.className = 'divider';
        rows.appendChild(div);
      }
      const row = document.createElement('div');
      row.className = 'wrow';

      const text = document.createElement('span');
      text.className = 'wrow-text';
      const name = document.createElement('span');
      name.className = 'wrow-name';
      name.textContent = ex.name;
      const rx = document.createElement('span');
      rx.className = 'wrow-rx';
      rx.textContent = ex.rx;
      text.append(name, rx);

      const input = document.createElement('input');
      input.type = 'text';
      input.maxLength = 8;
      input.setAttribute('inputmode', 'decimal');
      input.setAttribute('aria-label', ex.name + ' — weight used' +
        (last[ex.id] != null ? ' (last time ' + last[ex.id] + ')' : ''));
      input.dataset.id = ex.id;
      input.value = fields[ex.id] || '';
      input.placeholder = last[ex.id] != null ? last[ex.id] : '';
      input.addEventListener('input', () => {
        const f = draft.fields[r.id] || (draft.fields[r.id] = {});
        const v = input.value.trim();
        if(v) f[ex.id] = v; else delete f[ex.id];
        if(!Object.keys(f).length) delete draft.fields[r.id];
        saveDraft();
        setStatus('');
      });

      row.append(text, input);
      rows.appendChild(row);
    });
    card.appendChild(rows);
    host.appendChild(card);
  });
}

function recordWorkout(){
  const r = currentRoutine();
  const weights = {};
  Object.entries(draft.fields[r.id] || {}).forEach(([id, v]) => {
    v = String(v).trim();
    if(v) weights[id] = v;
  });
  if(!Object.keys(weights).length){
    setStatus('Nothing to record — type at least one weight.');
    return;
  }
  const at = new Date();
  const log = loadLog();
  log.push({ id: 'w' + at.getTime().toString(36), routine: r.id, at: at.toISOString(), weights });
  // A failed write (storage full/blocked) keeps the typed weights and says so.
  try{ localStorage.setItem(LOG_KEY, JSON.stringify(log)); }
  catch(e){ setStatus('Could not save — storage is full or blocked.'); return; }
  delete draft.fields[r.id];
  saveDraft();
  renderWorkouts();
  setStatus('Recorded — ' + r.name + ', ' +
    at.toLocaleDateString(undefined, { weekday:'short', month:'short', day:'numeric' }) + '.', true);
}
document.getElementById('record').addEventListener('click', recordWorkout);

/* ---- tabs ---- */
function showTab(which){
  const floor = which === 'floor';
  document.getElementById('view-floor').hidden = !floor;
  document.getElementById('view-workouts').hidden = floor;
  document.getElementById('tab-floor').setAttribute('aria-selected', String(floor));
  document.getElementById('tab-workouts').setAttribute('aria-selected', String(!floor));
  // Switching to workouts leaves the week lens — the shared header always
  // shows the live week there.
  if(!floor && viewing){ viewing = null; render(); }
}
document.getElementById('tab-floor').addEventListener('click', () => showTab('floor'));
document.getElementById('tab-workouts').addEventListener('click', () => showTab('workouts'));

document.getElementById('reset').addEventListener('click', reset);
document.getElementById('back-live').addEventListener('click', () => { viewing = null; render(); });
syncWeek();
renderWorkouts();

// updateViaCache:'none' keeps the HTTP cache out of sw.js checks, and every
// return to the foreground forces one — belt and braces for WebViews that
// skip the automatic re-check.
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then(reg => {
    document.addEventListener('visibilitychange', () => {
      if(document.visibilityState === 'visible') reg.update();
    });
  });
}
</script>
